<!DOCTYPE html>
<html>

<head>
  <title>Student ERP - Admin Panel</title>
</head>

<body>

  <a href="index.html">Home</a> |
  <a href="admission.html">Apply Now</a> |
  <a href="records.html">Admin Panel</a>

  <hr>

  <h1>Admin Panel - All Admission Records</h1>
  <p>This page shows all students who applied for admission.</p>

  <hr>

  <h3>Filter Records</h3>

  Filter by Course:
  <select id="filterCourse" onchange="filterRecords()">
    <option value="ALL">All Courses</option>
    <option value="BCA">BCA</option>
    <option value="MCA">MCA</option>
    <option value="BBA">BBA</option>
    <option value="MBA">MBA</option>
  </select>

  &nbsp;&nbsp;

  Search by Name:
  <input type="text" id="searchName" placeholder="Type student name" oninput="filterRecords()">

  &nbsp;
  <button onclick="filterRecords()">Search</button>
  <button onclick="resetFilter()">Show All</button>

  <br><br>

  <p id="totalCount"><b>Total Records: 0</b></p>

  <hr>

  <div id="recordsContainer">
    <p>Loading records...</p>
  </div>

  <hr>

  <h3>Admin Actions</h3>
  <button onclick="clearAllRecords()">DELETE ALL RECORDS</button>
  <p>Warning: This will delete all records permanently.</p>


  <script>

    var allAdmissions = [];


    function loadRecords() {
      allAdmissions = JSON.parse(localStorage.getItem('admissions')) || [];
      displayRecords(allAdmissions);
    }


    function displayRecords(list) {

      var container = document.getElementById('recordsContainer');
      var totalCount = document.getElementById('totalCount');

      totalCount.innerHTML = '<b>Total Records: ' + list.length + '</b>';

      if (list.length == 0) {
        container.innerHTML = '<p>No records found.</p>';
        return;
      }

      var html = '';
      html += '<table border="1" cellpadding="8">';

      html += '<tr>';
      html += '<th>S.No</th>';
      html += '<th>App No.</th>';
      html += '<th>Date</th>';
      html += '<th>Name</th>';
      html += '<th>Course</th>';
      html += '<th>Gender</th>';
      html += '<th>Category</th>';
      html += '<th>Status</th>';
      html += '<th>Action</th>';
      html += '</tr>';

      for (var i = 0; i < list.length; i++) {

        var student = list[i];

        html += '<tr>';
        html += '<td>' + (i + 1) + '</td>';
        html += '<td>' + student.applicationNumber + '</td>';
        html += '<td>' + student.applyDate + '</td>';
        html += '<td>' + student.fullname + '</td>';
        html += '<td>' + student.course + '</td>';
        html += '<td>' + student.gender + '</td>';
        html += '<td>' + student.category + '</td>';
        html += '<td>' + student.status + '</td>';
        html += '<td>';
        html += '<button onclick="viewDetails(\'' + student.applicationNumber + '\')">View</button>';
        html += ' ';
        html += '<button onclick="updateStatus(\'' + student.applicationNumber + '\')">Update Status</button>';
        html += '</td>';
        html += '</tr>';

      }

      html += '</table>';

      container.innerHTML = html;
    }


    function filterRecords() {

      var selectedCourse = document.getElementById('filterCourse').value;
      var searchName = document.getElementById('searchName').value.toLowerCase();

      var filtered = [];

      for (var i = 0; i < allAdmissions.length; i++) {

        var student = allAdmissions[i];

        var courseMatch = true;
        if (selectedCourse != 'ALL') {
          courseMatch = (student.course == selectedCourse);
        }

        var nameMatch = student.fullname.toLowerCase().includes(searchName);

        if (courseMatch && nameMatch) {
          filtered.push(student);
        }

      }

      displayRecords(filtered);
    }


    function resetFilter() {
      document.getElementById('filterCourse').value = 'ALL';
      document.getElementById('searchName').value = '';
      displayRecords(allAdmissions);
    }


    function viewDetails(appNumber) {

      var student = null;

      for (var i = 0; i < allAdmissions.length; i++) {
        if (allAdmissions[i].applicationNumber == appNumber) {
          student = allAdmissions[i];
          break;
        }
      }

      if (student == null) {
        alert('Student not found!');
        return;
      }

      var msg = '';
      msg += 'Application No: ' + student.applicationNumber + '\n';
      msg += 'Date: ' + student.applyDate + '\n';
      msg += 'Status: ' + student.status + '\n\n';
      msg += 'Name: ' + student.fullname + '\n';
      msg += 'DOB: ' + student.dob + '\n';
      msg += 'Gender: ' + student.gender + '\n';
      msg += 'Category: ' + student.category + '\n';
      msg += 'Aadhar: ' + student.aadhar + '\n\n';
      msg += 'Course: ' + student.course + '\n';
      msg += 'Admission Mode: ' + student.admissionMode + '\n';

      alert(msg);
    }


    function updateStatus(appNumber) {

      var newStatus = prompt('Enter new status:\nOptions: Pending / Approved / Rejected', 'Approved');

      if (newStatus == null || newStatus == '') {
        return;
      }

      for (var i = 0; i < allAdmissions.length; i++) {
        if (allAdmissions[i].applicationNumber == appNumber) {
          allAdmissions[i].status = newStatus;
          break;
        }
      }

      localStorage.setItem('admissions', JSON.stringify(allAdmissions));

      filterRecords();

      alert('Status updated!');
    }


    function clearAllRecords() {

      var confirm1 = confirm('Are you sure? All records will be deleted!');

      if (confirm1) {
        localStorage.removeItem('admissions');
        localStorage.removeItem('lastAdmission');
        allAdmissions = [];
        displayRecords([]);
        alert('All records deleted!');
      }

    }


    window.onload = function() {
      loadRecords();
    };

  </script>

</body>

</html>
